name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository and Skill
        run: python3 scripts/validate_repo.py
      - name: Test evaluation summarizer
        run: python3 skills/job-navigation-skill/scripts/summarize_evals.py --self-test
      - name: Test supported deployment paths
        run: |
          for agent in codex claude cursor workbuddy; do
            python3 scripts/install.py --agent "$agent" --dest "/tmp/job-navigation-$agent"
            test -f "/tmp/job-navigation-$agent/job-navigation-skill/SKILL.md"
          done
          python3 scripts/package_skill.py --target all --output /tmp/job-navigation-dist
          version="$(cat VERSION)"
          test -f "/tmp/job-navigation-dist/job-navigation-skill-chatgpt-plugin-$version.zip"
          test -f "/tmp/job-navigation-dist/job-navigation-skill-claude-skill-$version.zip"
          test -f "/tmp/job-navigation-dist/job-navigation-skill-cursor-skill-$version.zip"
