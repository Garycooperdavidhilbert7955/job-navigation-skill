name: Aggregate evaluation result
description: Share paired baseline/Skill findings without raw user data.
title: "[Evaluation]: "
labels: [evaluation]
body:
  - type: checkboxes
    attributes:
      label: Data boundary
      options:
        - label: This issue contains aggregate results only—no prompts, resumes, raw outputs, names, contact details, or employer-confidential data.
          required: true
        - label: I will report null/negative findings and hard failures, not only the composite score.
          required: true
  - type: input
    attributes:
      label: Skill version and evaluation dates
    validations:
      required: true
  - type: input
    attributes:
      label: Complete paired tasks
    validations:
      required: true
  - type: textarea
    attributes:
      label: Controlled conditions
      description: Model/version, tool access, research window, time budget, run order, and reviewer blinding.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Quality differences
      description: Citation support, evidence calibration, personalization, actionability, and clarity/cognitive load.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Cost and failures
      description: Tokens, elapsed time, actual cost, missing fields, and hard failures by condition.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Interpretation and limits
      description: Include null or negative findings and explain why causal claims may still be unwarranted.
    validations:
      required: true
