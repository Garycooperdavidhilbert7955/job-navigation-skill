name: Bug report
description: Report an installation, validation, or Skill-behavior failure without personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed resumes, names, contact details, private prompts, secrets, and confidential job descriptions.
          required: true
  - type: input
    attributes:
      label: Skill version or commit
      placeholder: 0.4.0-beta or commit hash
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the failure using a minimal, non-identifying example.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and limits
      description: Codex version if known, operating system, model/tool access, inaccessible sources, and validation output.
    validations:
      required: true
